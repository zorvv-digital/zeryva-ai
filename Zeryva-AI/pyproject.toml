[project]
name = "zeryva-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zorvv.", email = "info.rguhub@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agno>=1.0.0",
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pgvector>=0.2.5",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "uvicorn[standard]>=0.28.0",
]

[project.scripts]
zeryva-ai = "zeryva_ai:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
